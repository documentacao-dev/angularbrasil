<button type="button" (click)="focusFirstHeading()" class="adev-skip">Skip to main content</button>

@defer (when isBrowser) {
  <adev-progress-bar />
  <docs-top-level-banner
    expiry="2025-10-20"
    id="state-of-js-2025"
    link="https://survey.devographics.com/en-US/survey/state-of-js/2025?source=angular_homepage"
    text="Share your experience with Angular in The State of JavaScript 2025 survey"
  />
}

<div class="adev-nav"></div>
@if (displaySecondaryNav()) {
  <adev-secondary-navigation />
}
<div class="docs-app-main-content">
  <!--
    Angular Brasil: sem Google Analytics nem banner de cookies do angular.dev
    (removidos do fork; o visitante daqui não é enviado à conta do Angular).
  -->
  @defer (when isBrowser) {
    @defer (when displaySearchDialog(); prefetch on idle) {
      @if (displaySearchDialog()) {
        <docs-search-dialog (onClose)="displaySearchDialog.set(false)" />
      }
    }
  }
  <router-outlet />

  @if (displayFooter()) {
    <footer adev-footer></footer>
  }
</div>
